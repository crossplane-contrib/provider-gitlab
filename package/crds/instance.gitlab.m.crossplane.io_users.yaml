---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: users.instance.gitlab.m.crossplane.io
spec:
  group: instance.gitlab.m.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - gitlab
    kind: User
    listKind: UserList
    plural: users
    singular: user
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .status.atProvider.state
      name: STATE
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          A User is a managed resource that represents a GitLab instance user.
          Deleting it deletes the GitLab user. GitLab removes the user's personal
          projects and moves the user's contributions to the ghost user.
          GitLab refuses to delete a user who is the sole owner of a group.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: A UserSpec defines the desired state of a GitLab user.
            properties:
              forProvider:
                description: |-
                  UserParameters define the desired state of a GitLab user.
                  The ProviderConfig must authenticate with an instance administrator token.
                  When Admin Mode is enabled, the token also needs the admin_mode scope.

                  GitLab API docs:
                  https://docs.gitlab.com/api/users/
                properties:
                  admin:
                    description: Admin grants instance administrator privileges.
                    type: boolean
                  canCreateGroup:
                    description: CanCreateGroup allows the user to create top level
                      groups.
                    type: boolean
                  email:
                    description: |-
                      Email is the primary email address of the user.
                      Changes are applied without email reconfirmation.
                    minLength: 1
                    type: string
                  external:
                    description: External limits the user to projects they are explicitly
                      granted access to.
                    type: boolean
                  forceRandomPassword:
                    description: |-
                      ForceRandomPassword sets a random password when the user is created.
                      Use it for users that only sign in through an external identity provider.
                    type: boolean
                  name:
                    description: Name is the display name of the user.
                    minLength: 1
                    type: string
                  note:
                    description: Note is an administrator note about the user.
                    type: string
                  passwordSecretRef:
                    description: |-
                      PasswordSecretRef selects the secret key that holds the initial password.
                      GitLab never returns passwords, so the value is only sent when the user is created.
                      GitLab rejects a new user unless passwordSecretRef, resetPassword or forceRandomPassword is set.
                      Mutually exclusive with resetPassword and forceRandomPassword.
                    properties:
                      key:
                        type: string
                      name:
                        description: Name of the secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  projectsLimit:
                    description: ProjectsLimit is the number of personal projects
                      the user can create.
                    format: int64
                    minimum: 0
                    type: integer
                  resetPassword:
                    description: ResetPassword sends the user a password reset link
                      when the user is created.
                    type: boolean
                  skipConfirmation:
                    description: SkipConfirmation marks the email address as confirmed
                      when the user is created.
                    type: boolean
                  state:
                    description: |-
                      State is the administrative state of the user.
                      When unset, the provider does not change the state.
                    enum:
                    - active
                    - blocked
                    type: string
                  username:
                    description: |-
                      Username is the unique handle of the user.
                      Changing it renames the user's personal namespace.
                    minLength: 1
                    type: string
                required:
                - email
                - name
                - username
                type: object
                x-kubernetes-validations:
                - message: passwordSecretRef is mutually exclusive with resetPassword
                    and forceRandomPassword
                  rule: '!has(self.passwordSecretRef) || !((has(self.resetPassword)
                    && self.resetPassword) || (has(self.forceRandomPassword) && self.forceRandomPassword))'
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: A UserStatus represents the observed state of a GitLab user.
            properties:
              atProvider:
                description: UserObservation represents the observed state of a GitLab
                  user.
                properties:
                  admin:
                    description: Admin reports whether the user is an instance administrator.
                    type: boolean
                  canCreateGroup:
                    description: CanCreateGroup reports whether the user can create
                      top level groups.
                    type: boolean
                  email:
                    description: Email is the primary email address of the user.
                    type: string
                  external:
                    description: External reports whether the user is an external
                      user.
                    type: boolean
                  id:
                    description: ID is the unique identifier of the user.
                    format: int64
                    type: integer
                  name:
                    description: Name is the display name of the user.
                    type: string
                  namespaceId:
                    description: NamespaceID is the ID of the user's personal namespace.
                    format: int64
                    type: integer
                  note:
                    description: Note is the administrator note about the user.
                    type: string
                  projectsLimit:
                    description: ProjectsLimit is the number of personal projects
                      the user can create.
                    format: int64
                    type: integer
                  state:
                    description: State is the state GitLab reports, for example active,
                      blocked, deactivated or banned.
                    type: string
                  username:
                    description: Username is the unique handle of the user.
                    type: string
                required:
                - admin
                - canCreateGroup
                - email
                - external
                - id
                - name
                - namespaceId
                - note
                - projectsLimit
                - state
                - username
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
