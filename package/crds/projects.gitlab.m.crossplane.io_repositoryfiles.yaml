---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: repositoryfiles.projects.gitlab.m.crossplane.io
spec:
  group: projects.gitlab.m.crossplane.io
  names:
    categories:
    - crossplane
    - managed
    - gitlab
    kind: RepositoryFile
    listKind: RepositoryFileList
    plural: repositoryfiles
    singular: repositoryfile
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.forProvider.projectId
      name: PROJECT
      type: string
    - jsonPath: .spec.forProvider.filePath
      name: FILE
      type: string
    - jsonPath: .spec.forProvider.branch
      name: BRANCH
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: READY
      type: string
    - jsonPath: .status.conditions[?(@.type=='Synced')].status
      name: SYNCED
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A RepositoryFile is a managed resource that represents a file
          in a GitLab repository.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: A RepositoryFileSpec defines the desired state of a GitLab
              Repository File.
            properties:
              forProvider:
                description: |-
                  RepositoryFileParameters define the desired state of a file in a GitLab
                  repository. A file is identified by projectId, branch and filePath, all of
                  which are immutable.

                  Which actions Crossplane takes on the file is controlled by
                  spec.managementPolicies, not by fields in here. For example
                  ["Observe", "Create"] commits the file once and then never overwrites or
                  deletes it, and ["Observe"] tracks a file without ever committing.

                  https://docs.gitlab.com/api/repository_files/
                properties:
                  authorEmail:
                    description: AuthorEmail is the commit author email.
                    type: string
                  authorName:
                    description: AuthorName is the commit author name.
                    type: string
                  branch:
                    description: |-
                      Branch is the branch the file lives on. It must already exist unless
                      the repository is empty; the provider does not create branches.
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: branch is immutable
                      rule: self == oldSelf
                  content:
                    description: |-
                      Content is the file content, encoded as described by Encoding.
                      Mutually exclusive with ContentSecretRef. One of the two is required
                      unless managementPolicies allow neither Create nor Update.
                    type: string
                  contentSecretRef:
                    description: |-
                      ContentSecretRef references a Secret key holding the file content,
                      encoded as described by Encoding. Mutually exclusive with Content.
                      Note that the content is committed to the repository, so it is only
                      as secret as the repository itself.
                    properties:
                      key:
                        type: string
                      name:
                        description: Name of the secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  createCommitMessage:
                    description: |-
                      CreateCommitMessage is the commit message used when creating the file.
                      Defaults to "crossplane: create <filePath>".
                    type: string
                  deleteCommitMessage:
                    description: |-
                      DeleteCommitMessage is the commit message used when deleting the file.
                      Defaults to "crossplane: delete <filePath>".
                    type: string
                  encoding:
                    default: text
                    description: |-
                      Encoding describes how Content or the referenced Secret value is
                      encoded.
                    enum:
                    - text
                    - base64
                    type: string
                  executeFilemode:
                    description: ExecuteFilemode enables the executable flag on the
                      file.
                    type: boolean
                  filePath:
                    description: FilePath is the path of the file in the repository,
                      e.g. "docs/README.md".
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: filePath is immutable
                      rule: self == oldSelf
                  projectId:
                    description: ProjectID is the ID or URL-encoded path of the project.
                    type: string
                    x-kubernetes-validations:
                    - message: projectId is immutable
                      rule: self == oldSelf
                  projectIdRef:
                    description: ProjectIDRef is a reference to a project to retrieve
                      its projectId.
                    properties:
                      name:
                        description: Name of the referenced object.
                        type: string
                      namespace:
                        description: Namespace of the referenced object
                        type: string
                      policy:
                        description: Policies for referencing.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    required:
                    - name
                    type: object
                    x-kubernetes-validations:
                    - message: projectIdRef is immutable
                      rule: self == oldSelf
                  projectIdSelector:
                    description: ProjectIDSelector selects reference to a project
                      to retrieve its projectId.
                    properties:
                      matchControllerRef:
                        description: |-
                          MatchControllerRef ensures an object with the same controller reference
                          as the selecting object is selected.
                        type: boolean
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: MatchLabels ensures an object with matching labels
                          is selected.
                        type: object
                      namespace:
                        description: Namespace for the selector
                        type: string
                      policy:
                        description: Policies for selection.
                        properties:
                          resolution:
                            default: Required
                            description: |-
                              Resolution specifies whether resolution of this reference is required.
                              The default is 'Required', which means the reconcile will fail if the
                              reference cannot be resolved. 'Optional' means this reference will be
                              a no-op if it cannot be resolved.
                            enum:
                            - Required
                            - Optional
                            type: string
                          resolve:
                            description: |-
                              Resolve specifies when this reference should be resolved. The default
                              is 'IfNotPresent', which will attempt to resolve the reference only when
                              the corresponding field is not present. Use 'Always' to resolve the
                              reference on every reconcile.
                            enum:
                            - Always
                            - IfNotPresent
                            type: string
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: projectIdSelector is immutable
                      rule: self == oldSelf
                  updateCommitMessage:
                    description: |-
                      UpdateCommitMessage is the commit message used when updating the file.
                      Defaults to "crossplane: update <filePath>".
                    type: string
                required:
                - branch
                - filePath
                type: object
                x-kubernetes-validations:
                - message: projectId cannot be removed once set
                  rule: '!has(oldSelf.projectId) || has(self.projectId)'
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  kind: ClusterProviderConfig
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
            x-kubernetes-validations:
            - message: spec.forProvider.content and spec.forProvider.contentSecretRef
                are mutually exclusive
              rule: '!(has(self.forProvider.content) && has(self.forProvider.contentSecretRef))'
            - message: spec.forProvider.content or spec.forProvider.contentSecretRef
                is required when managementPolicies allow Create or Update
              rule: '!(''*'' in self.managementPolicies || ''Create'' in self.managementPolicies
                || ''Update'' in self.managementPolicies) || has(self.forProvider.content)
                || has(self.forProvider.contentSecretRef)'
          status:
            description: A RepositoryFileStatus represents the observed state of a
              GitLab Repository File.
            properties:
              atProvider:
                description: RepositoryFileObservation represents the observed state
                  of a GitLab Repository File.
                properties:
                  blobId:
                    description: BlobID is the blob SHA of the file.
                    type: string
                  filePath:
                    description: FilePath is the observed file path.
                    type: string
                  lastCommitId:
                    description: |-
                      LastCommitID is the last commit SHA that modified this file, as seen by
                      the most recent observation. It is sent with updates and deletes so
                      GitLab rejects them if the file changed after that observation. This
                      only guards a single reconcile: the next one observes the new commit
                      and, if updates are allowed, enforces the desired content again.
                    type: string
                  sha256:
                    description: SHA256 is the SHA-256 hash of the file content.
                    type: string
                  size:
                    description: Size is the file size in bytes.
                    format: int64
                    type: integer
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt holds the value of the most recent
                  reconcile-requested-at annotation token that the controller has
                  processed. Users can compare this to the annotation to determine
                  whether a reconcile request has been handled.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest metadata.generation
                  which resulted in either a ready state, or stalled due to error
                  it can not recover from without human intervention.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
