      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    - jsonPath: .spec.forProvider.projectId
      name: PROJECT
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A IntegrationTelegram is a managed resource that represents a
          GitLab Project Telegram Integration.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: A IntegrationTelegramSpec defines the desired state of a
              GitLab Project Telegram Integration.
            properties:
              forProvider:
                description: ForProvider represents the desired state of the Telegram
                  integration.
                properties:
                  branchesToBeNotified:
                    description: BranchesToBeNotified selects the branches to send
                      notifications for. GitLab defaults to default.
                    enum:
                    - all
                    - default
                    - protected
                    - default_and_protected
                    type: string
                  confidentialIssuesEvents:
                    description: ConfidentialIssuesEvents enables notifications for
                      confidential issue events.
                    type: boolean
                  confidentialNoteEvents:
                    description: ConfidentialNoteEvents enables notifications for
                      confidential note events.
                    type: boolean
                  issuesEvents:
                    description: IssuesEvents enables notifications for issue events.
                    type: boolean
                  mergeRequestsEvents:
                    description: MergeRequestsEvents enables notifications for merge
                      request events.
                    type: boolean
                  noteEvents:
                    description: NoteEvents enables notifications for note events.
                    type: boolean
                  notifyOnlyBrokenPipelines:
                    description: NotifyOnlyBrokenPipelines sends notifications for
                      broken pipelines only.
                    type: boolean
                  pipelineEvents:
                    description: PipelineEvents enables notifications for pipeline
                      events.
                    type: boolean
                  projectId:
                    description: ProjectID is the ID of the project.
                    format: int64
                    type: integer
