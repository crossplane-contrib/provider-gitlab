                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  kind:
                    description: Kind of the referenced object.
                    type: string
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - kind
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                required:
                - name
                type: object
            required:
            - forProvider
            type: object
          status:
            description: A IntegrationTelegramStatus represents the observed state
              of a GitLab Project Telegram Integration.
            properties:
              atProvider:
                description: AtProvider represents the observed state of the Telegram
                  integration.
                properties:
                  active:
                    type: boolean
                  alertEvents:
                    type: boolean
                  branchesToBeNotified:
                    description: BranchesToBeNotified are the branches notifications
                      are sent for.
                    type: string
                  commentOnEventEnabled:
                    type: boolean
                  commitEvents:
                    type: boolean
                  confidentialIssuesEvents:
                    type: boolean
                  confidentialNoteEvents:
                    type: boolean
                  createdAt:
                    format: date-time
                    type: string
                  deploymentEvents:
                    type: boolean
                  groupConfidentialMentionEvents:
                    type: boolean
                  groupMentionEvents:
                    type: boolean
                  id:
                    format: int64
                    type: integer
                  incidentEvents:
                    type: boolean
                  inherited:
                    type: boolean
                  issuesEvents:
                    type: boolean
                  jobEvents:
                    type: boolean
                  mergeRequestsEvents:
                    type: boolean
                  noteEvents:
                    type: boolean
                  notifyOnlyBrokenPipelines:
                    description: NotifyOnlyBrokenPipelines indicates whether notifications
                      are sent for broken pipelines only.
                    type: boolean
                  pipelineEvents:
                    type: boolean
                  pushEvents:
                    type: boolean
                  room:
                    description: Room is the target chat or channel.
