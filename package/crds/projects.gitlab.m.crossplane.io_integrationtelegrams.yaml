                  pushEvents:
                    description: PushEvents enables notifications for push events.
                    type: boolean
                  room:
                    description: Room is the unique identifier of the target chat
                      or the username of the target channel (in the format @channelusername).
                    type: string
                  tagPushEvents:
                    description: TagPushEvents enables notifications for tag push
                      events.
                    type: boolean
                  tokenSecretRef:
                    description: |-
                      TokenSecretRef is a reference to a secret that contains the Telegram bot token.
                      WARNING: This field is NOT reconciled as the GitLab API does not return it as it is a write-only field.
                    properties:
                      key:
                        type: string
                      name:
                        description: Name of the secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  wikiPageEvents:
                    description: WikiPageEvents enables notifications for wiki page
                      events.
                    type: boolean
                required:
                - room
                - tokenSecretRef
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
