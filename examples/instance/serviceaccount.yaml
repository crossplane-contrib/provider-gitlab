---
apiVersion: instance.gitlab.m.crossplane.io/v1alpha1
kind: ServiceAccount
metadata:
  name: example-instance
  namespace: default
spec:
  providerConfigRef:
    name: gitlab-provider
    kind: ProviderConfig
  forProvider:
    name: Example Service Account
    username: example-service-account
    # WARNING: field is immutable after creation
    # email: example@example.com
    # WARNING: dangerous field, it will grant admin permissions to the service account
    # admin: true
    # WARNING: dangerous field, it will grant developer permissions on all top level groups to the service account
    # baselinePermissions: developer
    # Restrict baselinePermissions to the top level groups whose path matches at least one of these regular expressions.
    # When omitted or empty, every top level group is selected.
    # baselinePermissionsFilters:
    #   - ^platform-
    #   - ^infra$
    # Base64 encoded PNG, JPEG, GIF, BMP, WEBP or ICO image, at most 200 KB.
    # Setting it requires an administrator token.
    # avatar: iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAIAAABLbSncAAAAEElEQVR4nGNgYPiPAw0pCQCpcD/BFMrqcwAAAABJRU5ErkJggg==
    # Or read the image from a Secret key in the same namespace instead of avatar.
    # The key holds the raw image bytes, for example from
    # kubectl create secret generic example-instance-avatar --from-file=avatar=avatar.png
    # avatarSecretRef:
    #   name: example-instance-avatar
    #   key: avatar
