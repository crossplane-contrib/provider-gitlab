---
apiVersion: projects.gitlab.m.crossplane.io/v1alpha1
kind: IntegrationMicrosoftTeams
metadata:
  name: microsoftteams-p7
  namespace: default
spec:
  providerConfigRef:
    name: gitlab-provider
    kind: ProviderConfig
  forProvider:
    projectId: 7
    webhookSecretRef:
      name: teams-credentials
      key: webhook
    notifyOnlyBrokenPipelines: true
    branchesToBeNotified: "default"
    pipelineEvents: true
