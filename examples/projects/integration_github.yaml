---
apiVersion: projects.gitlab.m.crossplane.io/v1alpha1
kind: IntegrationGithub
metadata:
  name: github-p7
  namespace: default
spec:
  providerConfigRef:
    name: gitlab-provider
    kind: ProviderConfig
  forProvider:
    projectId: 7
    repositoryUrl: "https://github.com/example-org/example-repo"
    staticContext: true
    tokenSecretRef:
      name: github-credentials
      key: token
