---
apiVersion: projects.gitlab.m.crossplane.io/v1alpha1
kind: ServiceAccount
metadata:
  name: example-project-sa
  namespace: default
spec:
  providerConfigRef:
    name: gitlab-provider
    kind: ProviderConfig
  forProvider:
    # The project that owns the service account, by ID or reference.
    projectIdRef:
      name: example-project
    name: Example Project Service Account
    username: example-project-sa
    # Base64 encoded PNG, JPEG, GIF, BMP, WEBP or ICO image, at most 200 KB.
    # Setting it requires an administrator token.
    # avatar: iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAIAAABLbSncAAAAEElEQVR4nGNgYPiPAw0pCQCpcD/BFMrqcwAAAABJRU5ErkJggg==
