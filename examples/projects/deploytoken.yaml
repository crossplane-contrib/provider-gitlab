apiVersion: projects.gitlab.crossplane.io/v1alpha1
kind: DeployToken
metadata:
  name: example-deploy-token
spec:
  forProvider:
    projectIdRef:
      name: example-project
    scopes:
      - "read_repository"
  providerConfigRef:
    name: gitlab-provider
  writeConnectionSecretToRef:
    name: gitlab-example-deploy-token
    namespace: crossplane-system
---
apiVersion: projects.gitlab.crossplane.io/v1alpha1
kind: DeployToken
metadata:
  name: example-deploy-token-renewed
spec:
  forProvider:
    projectIdRef:
      name: example-project
    # The old token is deleted before the new one is created, so consumers see
    # a short gap until the connection secret is updated and picked up.
    renewalPeriodDays: 30 # replace the token 10 days before it expires
    scopes:
      - "read_repository"
  providerConfigRef:
    name: gitlab-provider
  writeConnectionSecretToRef:
    name: gitlab-example-deploy-token-renewed
    namespace: crossplane-system