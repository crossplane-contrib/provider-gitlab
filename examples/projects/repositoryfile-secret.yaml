apiVersion: v1
kind: Secret
metadata:
  name: example-repositoryfile-content
  namespace: default
type: Opaque
stringData:
  content: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: generated-file
---
apiVersion: projects.gitlab.m.crossplane.io/v1alpha1
kind: RepositoryFile
metadata:
  name: example-repositoryfile-secret
  namespace: default
spec:
  forProvider:
    projectIdRef:
      name: example-project
    filePath: manifests/generated-file.yaml
    branch: main
    # The value is committed to the repository as-is, so it is only as secret
    # as the repository. Changes to the Secret are picked up on the next poll.
    contentSecretRef:
      name: example-repositoryfile-content
      key: content
    createCommitMessage: "feat: add generated manifest"
    updateCommitMessage: "feat: update generated manifest"
    deleteCommitMessage: "feat: remove generated manifest"
  providerConfigRef:
    name: gitlab-provider
    kind: ProviderConfig
