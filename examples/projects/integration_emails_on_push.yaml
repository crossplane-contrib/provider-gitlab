---
apiVersion: projects.gitlab.m.crossplane.io/v1alpha1
kind: IntegrationEmailsOnPush
metadata:
  name: emails-on-push-p7
  namespace: default
spec:
  providerConfigRef:
    name: gitlab-provider
    kind: ProviderConfig
  forProvider:
    projectId: 7
    recipients: "dev-team@example.com release-managers@example.com"
    disableDiffs: false
    sendFromCommitterEmail: false
    pushEvents: true
    tagPushEvents: true
    branchesToBeNotified: default_and_protected
