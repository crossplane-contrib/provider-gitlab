---
apiVersion: projects.gitlab.m.crossplane.io/v1alpha1
kind: IntegrationRedmine
metadata:
  name: redmine-p7
  namespace: default
spec:
  providerConfigRef:
    name: gitlab-provider
    kind: ProviderConfig
  forProvider:
    projectId: 7
    projectUrl: "https://redmine.example.com/projects/example"
    issuesUrl: "https://redmine.example.com/issues/:id"
    newIssueUrl: "https://redmine.example.com/projects/example/issues/new"
