---
# Gitlab provider that references the secret credentials
apiVersion: gitlab.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: gitlab-provider
spec:
  baseURL: https://gitlab.com/
  credentials:
    source: Secret
    method: PersonalAccessToken
    secretRef:
      namespace: crossplane-system
      name: gitlab-credentials
      key: token
  # Optional: HMAC key used to detect changes to write-only secret values
  # (e.g. integration webhooks) that GitLab never returns. See README.
  # secretHashKeySecretRef:
  #   namespace: crossplane-system
  #   name: gitlab-secret-hash-key
  #   key: key
