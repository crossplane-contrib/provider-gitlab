apiVersion: groups.gitlab.crossplane.io/v1alpha1
kind: DeployToken
metadata:
  name: example-deploy-token
spec:
  forProvider:
    groupIdRef:
      name: example-group
    scopes:
      - "read_repository"
  providerConfigRef:
    name: gitlab-provider
  writeConnectionSecretToRef:
    name: gitlab-example-deploy-token
    namespace: crossplane-system
---
apiVersion: groups.gitlab.crossplane.io/v1alpha1
kind: DeployToken
metadata:
  name: example-deploy-token-renewed
spec:
  forProvider:
    groupIdRef:
      name: example-group
    # The old token is deleted before the new one is created, so consumers see
    # a short gap until the connection secret is updated and picked up.
    renewalPeriodDays: 30
    renewBeforeDays: 7 # replace the token 7 days before it expires
    scopes:
      - "read_repository"
  providerConfigRef:
    name: gitlab-provider
  writeConnectionSecretToRef:
    name: gitlab-example-deploy-token-renewed
    namespace: crossplane-system