---
apiVersion: groups.gitlab.m.crossplane.io/v1alpha1
kind: ServiceAccount
metadata:
  name: example-group-sa
  namespace: default
spec:
  providerConfigRef:
    name: gitlab-provider
    kind: ProviderConfig
  forProvider:
    name: Example Group Service Account 1
    username: example-group-service-account-1
    # Can specify the group by ID or by reference
    # groupIdRef:
    #   name: example-group
    groupId: 7
    # WARNING: this field is immutable if set
    # email: example@example.com
    # Base64 encoded PNG, JPEG, GIF, BMP, WEBP or ICO image, at most 200 KB.
    # Setting it requires an administrator token.
    # avatar: iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAIAAABLbSncAAAAEElEQVR4nGNgYPiPAw0pCQCpcD/BFMrqcwAAAABJRU5ErkJggg==
